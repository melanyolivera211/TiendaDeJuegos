<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Videojuego - Tienda de Videojuegos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 70px;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 30px;
        }
        .preview-image {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Contenido principal -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="form-container">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">
                            <i class="bi bi-plus-circle"></i> Agregar Nuevo Videojuego
                        </h2>
                        <p class="text-muted">Completa los datos del videojuego</p>
                    </div>

                    <form th:action="@{/videojuegos/agregar}" th:object="${videojuego}" method="post">
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">
                                <i class="bi bi-controller"></i> Nombre del Videojuego
                            </label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="nombre" 
                                   th:field="*{nombre}" 
                                   placeholder="Ej: The Legend of Zelda"
                                   required>
                        </div>

                        <!-- Categoría -->
                        <div class="mb-3">
                            <label for="categoria" class="form-label fw-bold">
                                <i class="bi bi-tag"></i> Categoría
                            </label>
                            <select class="form-select form-select-lg" 
                                    id="categoria" 
                                    th:field="*{categoria}" 
                                    required>
                                <option value="">Selecciona una categoría</option>
                                <option value="Acción">Acción</option>
                                <option value="Aventura">Aventura</option>
                                <option value="RPG">RPG</option>
                                <option value="Deportes">Deportes</option>
                                <option value="Estrategia">Estrategia</option>
                                <option value="Simulación">Simulación</option>
                                <option value="Puzzle">Puzzle</option>
                                <option value="Terror">Terror</option>
                                <option value="Carreras">Carreras</option>
                            </select>
                        </div>

                        <!-- Precio -->
                        <div class="mb-3">
                            <label for="precio" class="form-label fw-bold">
                                <i class="bi bi-currency-dollar"></i> Precio (USD)
                            </label>
                            <input type="number" 
                                   class="form-control form-control-lg" 
                                   id="precio" 
                                   th:field="*{precio}" 
                                   step="0.01" 
                                   min="0"
                                   placeholder="59.99"
                                   required>
                        </div>

                        <!-- URL de Imagen -->
                        <div class="mb-3">
                            <label for="imagen" class="form-label fw-bold">
                                <i class="bi bi-image"></i> URL de Imagen
                            </label>
                            <input type="url" 
                                   class="form-control form-control-lg" 
                                   id="imagen" 
                                   th:field="*{imagen}" 
                                   placeholder="https://ejemplo.com/imagen.jpg"
                                   onchange="previewImage(this.value)">
                            <img id="preview" class="preview-image" alt="Vista previa">
                            <small class="text-muted">
                                Puedes usar URLs de imágenes públicas (ej: de Google Images)
                            </small>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-4">
                            <label for="descripcion" class="form-label fw-bold">
                                <i class="bi bi-file-text"></i> Descripción
                            </label>
                            <textarea class="form-control" 
                                      id="descripcion" 
                                      th:field="*{descripcion}" 
                                      rows="4"
                                      placeholder="Describe las características del videojuego..."></textarea>
                        </div>

                        <!-- Botones -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="bi bi-check-circle"></i> Guardar Videojuego
                            </button>
                            <a href="/videojuegos" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function previewImage(url) {
            const preview = document.getElementById('preview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }
    </script>
</body>
</html>
