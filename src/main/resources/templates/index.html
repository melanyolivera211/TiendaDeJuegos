<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Videojuegos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 70px;
        }
        .card {
            height: 100%;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }
        .card-img-top {
            height: 250px;
            object-fit: cover;
        }
        .price-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #28a745;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10;
        }
        .category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #007bff;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            z-index: 10;
        }
        .empty-state {
            text-align: center;
            padding: 100px 20px;
        }
        .empty-state i {
            font-size: 5rem;
            color: #6c757d;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Contenido principal -->
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-bold">
                    <i class="bi bi-controller"></i> Catálogo de Videojuegos
                </h2>
                <p class="text-muted">Explora nuestra colección de videojuegos</p>
            </div>
        </div>

        <!-- Catálogo de videojuegos -->
        <div class="row g-4" th:if="${not #lists.isEmpty(videojuegos)}">
            <div class="col-md-4 col-lg-3" th:each="videojuego : ${videojuegos}">
                <div th:replace="~{fragments/card :: card(${videojuego})}"></div>
            </div>
        </div>

        <!-- Estado vacío -->
        <div class="empty-state" th:if="${#lists.isEmpty(videojuegos)}">
            <i class="bi bi-inbox"></i>
            <h3>No hay videojuegos registrados</h3>
            <p class="text-muted">Comienza agregando tu primer videojuego al catálogo</p>
            <a href="/videojuegos/nuevo" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-circle"></i> Agregar Videojuego
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
