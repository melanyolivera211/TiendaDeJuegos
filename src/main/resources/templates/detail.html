<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${videojuego.nombre} + ' - Detalle'">Detalle del Videojuego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 70px; }
        .detail-card { max-width: 1100px; margin: 30px auto; }
        .game-image { width: 100%; height: 450px; object-fit: cover; border-radius: 10px; }
        .price { font-size: 1.5rem; font-weight: 700; color: #28a745; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container detail-card">
        <div class="row g-4">
            <div class="col-md-6">
                <img th:src="${videojuego.imagen}" th:alt="${videojuego.nombre}" class="game-image" onerror="this.src='https://via.placeholder.com/800x450?text=Sin+Imagen'">
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title fw-bold" th:text="${videojuego.nombre}">Nombre del Juego</h2>
                        <p><span class="badge bg-primary" th:text="${videojuego.categoria}">Categoría</span></p>
                        <p class="text-muted" th:text="${videojuego.descripcion}">Descripción completa del videojuego...</p>

                        <hr>

                        <p class="price">$<span th:text="${#numbers.formatDecimal(videojuego.precio,1,2)}">59.99</span></p>

                        <div class="mt-4 d-flex gap-2">
                            <a href="/videojuegos" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button class="btn btn-success">
                                <i class="bi bi-cart-plus"></i> Comprar (simulado)
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
